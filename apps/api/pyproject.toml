[project]
name = "api"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "core-shared",
    "fastapi>=0.136.3,<1.0.0",
    "uvicorn>=0.48.0,<1.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0"
]

[tool.uv.sources]
core-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

