services:
  db:
    image: postgres:latest
    container_name: db
    env_file:
      - postgres.env
    volumes:
      - pd-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_bot_web
    command: uvicorn book_bot.main:app --app-dir src/ --host 0.0.0.0 --port 8080
    env_file:
      - tg_bot_web.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pd-data:
