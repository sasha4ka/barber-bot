[project]
name = "book-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Aleksandr Basov",email = "sasha4ka99991@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram (>=3.28.2,<4.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "aiohttp-socks (>=0.11.0,<0.12.0)",
    "redis (>=7.4.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "book_bot", from = "src"}]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
